[custom]
; Rules and DNS share the complete base; groups retain their manual region choices.
clash_rule_base=https://raw.githubusercontent.com/kingtol/OpenClash/main/qichiyu-clash-base.yaml?v=4518e4bf59e1a1a7063b
custom_proxy_group=中国直连`select`[]DIRECT
custom_proxy_group=美国 AI`select`[]台湾节点`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=美国影音`select`[]台湾节点`[]美国节点`[]美国 AI`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=其他海外影音`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=游戏`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=海外搜索`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=开发工具`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=办公与云服务`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=海外通信`select`[]台湾节点`[]美国 AI`[]美国节点`[]日本节点`[]新加坡节点`[]香港节点`[]其他地区节点`[]全部节点
custom_proxy_group=广告拦截`select`[]REJECT`[]PASS
custom_proxy_group=美国节点`select`美国|美國|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|硅谷|圣何塞|聖何塞|🇺🇸|(?:^|[^A-Za-z])(?:US|USA|United[ -]?States|America)(?=[^A-Za-z]|$)`[]REJECT
custom_proxy_group=台湾节点`select`台湾|台灣|台北|臺北|🇹🇼|(?:^|[^A-Za-z])(?:TW|Taiwan)(?=[^A-Za-z]|$)`[]REJECT
custom_proxy_group=日本节点`select`日本|东京|東京|大阪|埼玉|川日|泉日|沪日|深日|🇯🇵|(?:^|[^A-Za-z])(?:JP|Japan)(?=[^A-Za-z]|$)`[]REJECT
custom_proxy_group=新加坡节点`select`新加坡|狮城|獅城|加坡|🇸🇬|(?:^|[^A-Za-z])(?:SG|Singapore)(?=[^A-Za-z]|$)`[]REJECT
custom_proxy_group=香港节点`select`香港|🇭🇰|(?:^|[^A-Za-z])(?:HK|Hong[ -]?Kong)(?=[^A-Za-z]|$)`[]REJECT
custom_proxy_group=其他地区节点`select`^(?!.*(?:美国|美國|洛杉矶|洛杉磯|西雅图|西雅圖|纽约|紐約|硅谷|圣何塞|聖何塞|🇺🇸|(?:^|[^A-Za-z])(?:US|USA|United[ -]?States|America)(?=[^A-Za-z]|$)|台湾|台灣|台北|臺北|🇹🇼|(?:^|[^A-Za-z])(?:TW|Taiwan)(?=[^A-Za-z]|$)|日本|东京|東京|大阪|埼玉|川日|泉日|沪日|深日|🇯🇵|(?:^|[^A-Za-z])(?:JP|Japan)(?=[^A-Za-z]|$)|新加坡|狮城|獅城|加坡|🇸🇬|(?:^|[^A-Za-z])(?:SG|Singapore)(?=[^A-Za-z]|$)|香港|🇭🇰|(?:^|[^A-Za-z])(?:HK|Hong[ -]?Kong)(?=[^A-Za-z]|$))).*$`[]REJECT
custom_proxy_group=全部节点`select`.*`[]REJECT
enable_rule_generator=false
overwrite_original_rules=false
